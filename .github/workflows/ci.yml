name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang git pkg-config

      - name: Show toolchain
        run: |
          clang --version
          clang++ --version
          ar --version | head -1
          git --version

      - name: Run tests
        run: tests/run-all.sh

  network:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      SMELT_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang git pkg-config

      - name: Run network test
        run: tests/run-all.sh network
