[package]
name = "smelt"
version = "0.3.0"

[build]
c_standard = "c17"
warnings = "all"
src_dir = "src"
out_dir = "build"
link_flags = ["-lm"]
defines = ["VERSION=\"0.3.0\""]
include_dirs = ["src", "vendor"]
extra_sources = []

[profile.debug]
flags = ["-g", "-O0"]

[profile.release]
flags = ["-O3", "-DNDEBUG"]

[dependencies]
libgit2 = { pkg-config = "libgit2" }
ya_getopt = { git = "https://github.com/kubo/ya_getopt", files = ["ya_getopt.c", "ya_getopt.h"] }
xxHash = { git = "https://github.com/cyan4973/xxHash", files = ["xxhash.h", "xxhash.c"] }
tomlc17 = { git = "https://github.com/cktan/tomlc17", files = ["src/tomlc17.c", "src/tomlc17.h"] }
testlib = { path = "./testlib" }
