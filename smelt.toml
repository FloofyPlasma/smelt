[package]
name = "smelt"
version = "0.1.0"

[build]
c_standard = "c17"
warnings = "all"
src_dir = "src"
out_dir = "build"
link_flags = ["-lm"]
defines = ["VERSION=\"0.1.0\""]
include_dirs = ["src", "vendor"]
extra_sources = ["vendor/tomlc17.c", "vendor/xxhash.c"]

[profile.debug]
flags = ["-g", "-O0"]

[profile.release]
flags = ["-O3", "-DNDEBUG"]
